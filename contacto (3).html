<div class="auth-page" style="display:flex;min-height:calc(100vh - 68px);">
  <div class="auth-box" style="max-width:480px;">
    <h1>Contáctanos</h1>
    <p class="sub">Estamos aquí para ayudarte</p>

    <div class="field"><label>Nombre</label><input type="text" id="c-nombre" placeholder="Tu nombre"></div>
    <div class="field"><label>Correo electrónico</label><input type="email" id="c-email" placeholder="tu@correo.com"></div>
    <div class="field"><label>Asunto</label>
      <select id="c-asunto">
        <option>Soporte técnico</option>
        <option>Información sobre servicios</option>
        <option>Facturación</option>
        <option>Alianzas comerciales</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="field"><label>Mensaje</label><textarea id="c-mensaje" placeholder="Escribe tu mensaje..." rows="4"></textarea></div>

    <button class="auth-btn" onclick="sendContact()">Enviar mensaje</button>

    <div class="contact-info-box">
      <p>📍 Bogotá, Colombia</p>
      <p>✉️ Stivenaria14@gmail.com</p>
      <p>📞 +57 301 464 9387</p>
      <a class="wa-btn" href="https://wa.me/573014649387" target="_blank">💬 WhatsApp</a>

    <a class="back-link" href="index.html">← Volver al inicio</a>
  </div>
</div>

<footer>&copy; 2026 E.V CHARGE · Bogotá, Colombia.</footer>

<script>
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function sendContact() {
  const n = document.getElementById('c-nombre').value.trim();
  const e = document.getElementById('c-email').value.trim();
  const m = document.getElementById('c-mensaje').value.trim();
  if (!n || !e || !m) { toast('Completa todos los campos'); return; }
  toast('Mensaje enviado');
  setTimeout(() => location.href = 'index.html', 1800);
}

window.addEventListener('scroll', () => {
  const nav = document.getElementById('main-nav');
  if (nav) {
    if (window.scrollY > 10) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  }
});
</script>
</body>
