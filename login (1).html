<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E.V CHARGE — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="toast" id="toast"></div>

<div class="auth-page" style="display:flex;min-height:100vh;">
  <div class="auth-box">
    <h1>Iniciar Sesión</h1>
    <p class="sub">Bienvenido de nuevo a E.V CHARGE</p>
    <div class="field"><label>Usuario</label><input type="text" id="u-user" placeholder="Ingresa tu usuario"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="u-pass" placeholder="••••••••"></div>
    <p style="font-size:13px;color:var(--blue2);cursor:pointer;margin-bottom:8px;">¿Olvidaste tu contraseña?</p>
    <button class="auth-btn" onclick="loginUser()">Ingresar</button>
    <div class="auth-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
    <a class="back-link" href="index.html">← Volver al inicio</a>
  </div>
</div>

<script>
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function loginUser() {
  const u = document.getElementById('u-user').value.trim();
  const p = document.getElementById('u-pass').value.trim();
  if (!u || !p) { toast('Completa todos los campos'); return; }
  toast('Bienvenido, ' + u);
  setTimeout(() => location.href = 'panel_cliente.html', 1200);
}
</script>
</body>
</html>
